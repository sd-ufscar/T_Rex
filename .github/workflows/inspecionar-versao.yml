name: Inspecionar nova versao 7z (temporario)
on:
  push:
    paths:
      - '.github/workflows/inspecionar-versao.yml'
permissions:
  contents: read
jobs:
  inspecionar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Extrair e comparar sem alterar arquivos
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v 7z >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq p7zip-full
          fi
          mkdir -p /tmp/trex_novo
          7z x -y -o/tmp/trex_novo T_Rex-main_atualizado.7z >/tmp/7z_output.txt
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, collections, json, os
          base=Path('/tmp/trex_novo')
          old=Path('projeto/lab_05')
          def digest(p):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for c in iter(lambda:f.read(1024*1024),b''):h.update(c)
              return h.hexdigest()
          fresh=sorted(p for p in base.rglob('*') if p.is_file())
          orig=sorted(p for p in old.rglob('*') if p.is_file())
          print('FILES_NEW:',len(fresh),'FILES_OLD:',len(orig))
          if len(fresh)>4000 or sum(p.stat().st_size for p in fresh)>350_000_000:raise ValueError('Archive unusually large')
          seen=collections.defaultdict(list)
          for p in fresh:seen[p.name].append(p)
          for p in fresh:
              rel=str(p.relative_to(base))
              matches=[q for q in orig if q.name==p.name]
              if len(matches)==1:
                  state='UNCHANGED' if digest(p)==digest(matches[0]) else 'CHANGED'
              elif len(matches)>1:state='AMBIGUOUS'
              else:state='NEW'
              print(f'NEWFILE | {state:<10} | {p.stat().st_size:>9} | {digest(p)[:16]} | {rel}')
          for p in orig:
              if p.name not in seen:print('OLD_ONLY |',str(p.relative_to(old)))
          print('TOPLEVEL_NEW:',json.dumps(sorted(set(p.relative_to(base).parts[0] for p in fresh)),ensure_ascii=False))
          print('QPF_FILES:',json.dumps([str(p.relative_to(base)) for p in fresh if p.suffix.lower()=='.qpf'],ensure_ascii=False))
          print('ZIP_ORIGINAL_SHA256:',digest(Path('T_Rex-main_atualizado.7z')))
          PY
