name: Validacao funcional T-Rex
on:
  push:
    paths:
      - 'projeto/**'
      - '.github/workflows/validar-verilog.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Instalar simulador
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq iverilog
      - name: Sintaxe dos modulos e integracao HDL
        working-directory: projeto
        run: |
          iverilog -g2005-sv -Wall -s TREX_TOP -tnull TREX_TOP.v DinoGame.v DinoDraw.v VGA_SYNC.v video_PLL.v
      - name: Simulacao funcional atual
        working-directory: projeto
        run: |
          iverilog -g2005-sv -Wall -s tb_DinoGame -o /tmp/trex_tb DinoGame.v tb_DinoGame.v
          vvp /tmp/trex_tb | tee /tmp/trex_result.txt
          grep -F 'OK: estados, salto linear, retorno e colisao com cacto' /tmp/trex_result.txt
